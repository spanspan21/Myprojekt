name: Build Ascend APK

# Builds an installable debug APK on GitHub's runners (which have the Android
# SDK and access to Google's Maven repo) and publishes it as a GitHub Release
# asset so it can be downloaded and installed directly on a phone.
on:
  push:
    branches:
      - claude/life-tracking-ai-app-8fajp4
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ascend-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ascend.apk

      - name: Publish APK to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ascend-latest
          name: Ascend — Life OS (latest)
          body: |
            Installierbare APK von **Ascend — Life OS**.

            Futuristisches Life-Tracking-Dashboard mit:
            - 🤖 Overseer-KI, die dich motiviert
            - 🎯 Tägliche Ziele, Wasser- & Schach-Tracker mit Streak
            - ⌚ Fitnessuhr-Anbindung über Health Connect (Schlaf, Puls, HRV)

            Direkt herunterladen: **ascend.apk**
            (Auf dem Handy „Installation aus unbekannten Quellen" erlauben.)
          files: ascend.apk
