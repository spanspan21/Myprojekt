name: Build APK

# Builds an installable debug APK on GitHub's runners (which have the Android
# SDK and access to Google's Maven repo). Runs on every push to the feature
# branch and can also be triggered manually from the Actions tab.
on:
  push:
    branches:
      - claude/crypto-demo-wallet-app-vxxjc
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: crypto-demo-wallet-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk crypto-demo-wallet.apk

      - name: Publish APK to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: demo-latest
          name: Crypto Demo Wallet (latest)
          body: |
            Installierbare Demo-APK (Phantom-Look, offline, keine echten Transaktionen).
            Direkt herunterladen: crypto-demo-wallet.apk
          files: crypto-demo-wallet.apk
