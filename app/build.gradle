plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ascend.lifeos'
    compileSdk 34

    defaultConfig {
        applicationId "com.ascend.lifeos"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Android Health Connect — reads sleep, heart rate, HRV & resting HR
    // from the user's fitness band / smartwatch.
    // Pinned to alpha07: last version compatible with compileSdk 34 / AGP 8.5.2
    // (rc02 requires AGP 8.9.1 + compileSdk 36). Same APIs used here.
    implementation 'androidx.health.connect:connect-client:1.1.0-alpha07'
}
